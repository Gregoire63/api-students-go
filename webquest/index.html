<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebQuest - Apprendre le Frontend</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.41.0/min/vs/loader.js"></script>
</head>

<body>

<!-- ── Écran de chargement ── -->
<div id="loading-screen">
    <div class="loader-content">
        <img src="/logo.webp" alt="WebQuest" class="loader-logo" />
        <div class="loader-title">WebQuest</div>
        <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
        <div class="loader-hint">Chargement de l'éditeur…</div>
    </div>
</div>

<!-- Modal API Logs -->
<div id="api-logs-modal" class="api-modal hidden" role="dialog" aria-modal="true" aria-labelledby="api-modal-title">
    <div class="api-modal-content">
        <div class="api-modal-header">
            <h3 id="api-modal-title">🔌 Console API</h3>
            <button onclick="closeApiLogs()" aria-label="Fermer la console">✖</button>
        </div>
        <pre id="api-logs-output">Chargement des logs...</pre>
    </div>
</div>

<!-- Header -->
<header class="game-header">
    <div class="container">
        <h1 class="site-title">
            <img src="/logo.webp" alt="WebQuest logo" class="site-logo" />
            WebQuest
        </h1>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" id="progress-fill"></div>
            <span class="progress-text" id="progress-text">Niveau 0/12</span>
        </div>
        <div class="score" aria-label="Score XP">
            <span id="score">0</span> XP
        </div>
    </div>
</header>

<main class="container">
    <!-- Navigation niveaux -->
    <nav class="level-nav" id="level-nav" aria-label="Niveaux"></nav>

    <!-- Zone principale -->
    <div class="workspace" id="workspace">

        <!-- Panneau Cours (collapsible) -->
        <aside class="lesson-panel" id="lesson-panel" aria-label="Cours">
            <div class="lesson-header">
                <h2 id="lesson-title">Chargement...</h2>
            </div>
            <div class="lesson-body" id="lesson-body">
                <div id="lesson-content"></div>
            </div>
        </aside>

        <!-- Panneau Exercice -->
        <section class="exercise-panel" aria-label="Exercice">

            <div id="exercise-description"></div>

            <!-- Éditeur -->
            <div class="code-editor-wrapper">
                <div class="editor-tabs" role="tablist">
                    <button class="tab active" data-file="html" role="tab" aria-selected="true">index.html</button>
                    <button class="tab" data-file="css" role="tab" aria-selected="false">style.css</button>
                    <button class="tab" data-file="js" role="tab" aria-selected="false">script.js</button>
                </div>
                <div id="code-editor"></div>
            </div>

            <!-- Actions -->
            <div class="editor-actions">
                <button onclick="runCode()" class="btn-primary">▶ Exécuter</button>
                <button onclick="resetCode()" class="btn-secondary">⟳ Reset</button>
                <button id="api-btn" onclick="openApiLogs()" class="btn-secondary" style="display:none">Console de l'API</button>
                <button id="next-level-btn" onclick="goToNextLevel()" class="btn-success" disabled>Niveau suivant →</button>
            </div>

            <div id="feedback" class="feedback" role="alert" aria-live="polite"></div>

            <!-- Aperçu -->
            <div class="preview-panel">
                <div class="preview-header">
                    <h4>👁 Aperçu</h4>
                    <span class="preview-hint">Ctrl+s pour exécuter</span>
                </div>
                <iframe id="preview" title="Aperçu du code"></iframe>
            </div>
        </section>
    </div>
</main>

<script src="levels.js"></script>
<script src="script.js"></script>

</body>
</html>
